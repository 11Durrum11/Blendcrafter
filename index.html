<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Blendcrafter — Template Blending Character Builder for d20 3.5 SRD</title>
    <meta
      name="description"
      content="Blendcrafter is an open-source, client-side d20 3.5 SRD character builder with a template-blending engine that stacks races, monster templates, class levels, and feats using correct SRD stacking rules."
    />
    <meta property="og:title" content="Blendcrafter — d20 3.5 SRD Template Blending Character Builder" />
    <meta
      property="og:description"
      content="Blend a base race with monster templates, class levels, and feats into one composite character with a full audit trail of every stacking decision."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#14171F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blendcrafter" />
    <style>
      /* Pre-boot splash (Shaun, 2026-11-04): the app ships as one
         large bundle, and until it downloads and starts, an empty
         page paints the browser's default white — on a phone that
         reads as a white-screen hang. Paint the app's own dark
         slate from the very first frame instead, and show a
         loading splash inside #root; React replaces it the moment
         the app mounts. All inline: nothing here waits on a
         download. */
      html { background: #14171f; }
      #boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e8ddc9;
        font-family: Georgia, "Times New Roman", serif;
        text-align: center;
        padding: 24px;
      }
      #boot-splash .boot-title { font-size: 28px; letter-spacing: 0.02em; }
      #boot-splash .boot-sub { font-size: 14px; opacity: 0.75; font-family: system-ui, sans-serif; }
      #boot-splash .boot-ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(232, 221, 201, 0.25);
        border-top-color: #d9a441;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-ring"></div>
        <div class="boot-title">Blendcrafter</div>
        <div class="boot-sub">Loading the library — 23,000+ entries take a moment…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
